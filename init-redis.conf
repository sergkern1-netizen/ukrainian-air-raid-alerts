# Redis Configuration for Online Feature Cache
# Air Raid Alerts System

# Server
daemonize no
databases 16
save ""
stop-writes-on-bgsave-error yes
rdbcompression yes
dir /data

# Persistence (Append-Only File)
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Memory Management
maxmemory 512mb
maxmemory-policy allkeys-lru
maxmemory-samples 5

# Limits
maxclients 10000
timeout 0

# Logging
loglevel notice
logfile ""
syslog-enabled no

# Replication
repl-diskless-sync no
repl-diskless-sync-delay 5

# Keys eviction
lazyfree-lazy-eviction no
lazyfree-lazy-expire no
lazyfree-lazy-server-del no
replica-lazy-flush no

# AOF Rewrite
lazyfree-lazy-eviction no
lazyfree-lazy-expire no

# TCP
tcp-keepalive 300
tcp-backlog 511

# Slowlog
slowlog-log-slower-than 10000
slowlog-max-len 128

# Latency monitoring
latency-monitor-threshold 0

# Event notification
notify-keyspace-events ""

# Hash table settings
hash-max-ziplist-entries 512
hash-max-ziplist-value 64

# List settings
list-max-ziplist-size -2
list-compress-depth 0

# Set settings
set-max-intset-entries 512

# Sorted set settings
zset-max-ziplist-entries 128
zset-max-ziplist-value 64

# HyperLogLog
hll-sparse-max-bytes 3000

# Active rehashing
activerehashing yes

# Client output buffer limits
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# Frequency of active key expiration
hz 10

# RDB and AOF
rdb-save-incremental-fsync yes
aof-use-rdb-preamble yes

# Feature cache TTL settings (via Lua scripts)
# Time-to-live for feature cache entries (1 hour = 3600 seconds)
# Set by application on key creation: SETEX feature:<h3>:<timestamp> 3600 <json_value>
